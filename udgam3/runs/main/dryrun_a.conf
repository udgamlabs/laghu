# Udgam-3 dry run A (1 GPU, REAL shape and device batch): 300 steps = TST (1-75) -> normal -> phase-B switch (240), checkpoints every 100,
# preflight upload, final push, HF export + samples. Measures tok/s and peak memory per GPU for the main-run budget.
source "${LAGHU_REPO:-.}/udgam3/runs/main/common.sh"
RUN_NAME=udgam3-dry
GPU_TYPE="NVIDIA H100 80GB HBM3"
GPU_COUNT=1
CLOUD=SECURE
MAX_MIN=45
CKPT_REPO=YOUR_HF_NAMESPACE/laghu-ckpt-test
EXPORT_REPO=YOUR_HF_NAMESPACE/laghu-ckpt-test
SAVE_EVERY=100
DISK_GB=200
DATA_PATTERNS="shards/phaseA/shard_00000.parquet shards/phaseA/shard_00001.parquet shards/phaseA/shard_00002.parquet shards/phaseA/shard_00399.parquet shards/phaseB/shard_00323.parquet shards/phaseB/shard_00399.parquet"   # 00399 = the val shard (last in both dirs); names checked against the HF listing
TRAIN_ARGS="$SHAPE $RECIPE --num-iterations 300 --eval-every 100 --eval-tokens 2097152 $VALS"
WANDB_RUN_ID=udgam3-dry-a
