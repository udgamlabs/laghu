# Udgam-3 MAIN RUN on Shadeform, 8x A100 80GB SXM4 NVLink (Massed Compute DGX, Beltsville). NOT APPROVED until the user
# says go. Same model, data, 40B positions (76,294 steps x 524,288), recipe and code as main.conf; only the hardware
# changes: device batch 16 (as in the A100 smoke test) -> 2 accumulation steps on 8 GPUs, same total batch.
source "${LAGHU_REPO:-.}/udgam3/runs/main/main.conf"
SF_CLOUD=massedcompute
SF_REGION=beltsville-usa-1
SF_TYPE=A100_sxm4_80G_DGXx8
SF_OS=ubuntu22.04_cuda13.0_shade_os
MAX_MIN=895            # ETA 11.3 h training (129K tok/s/GPU x 8 x 95%) x 1.25 + 45 min (provisioning, setup, export)
SF_SPEND_CAP=167.00    # $11.04/h x (895 + 10) min: Shadeform deletes the instance at this spend
TRAIN_ARGS="$(echo "$SHAPE $RECIPE" | sed 's/--device-batch-size 32/--device-batch-size 16/') --num-iterations $NUM_ITERS --eval-every 2000 --eval-tokens 4194304 $VALS"
