# Shadeform SMOKE TEST (needs the user's go; paid, ~$1, cap $3): proves the Shadeform path end to end on a CUDA-12.4
# host image (the image family of the cheap 8x H100 offers: Voltage Park, Lambda, Denvr, Nebius) with a Hopper GPU:
# bootstrap + docker GPU access + big-disk workspace, torch cu128 + FA3 on a 12.4 driver, HF data/preflight/checkpoints,
# export + samples + DONE, the self-delete mirror and Shadeform's auto_delete. Real 150M shape and batch, 60 steps.
source "${LAGHU_REPO:-.}/udgam3/runs/main/common.sh"
RUN_NAME=udgam3-sf-smoke
SF_CLOUD=lambdalabs
SF_REGION=${SF_REGION:-saltlakecity-usa-1}
SF_TYPE=${SF_TYPE:-H100}
SF_OS=ubuntu22.04_cuda12.4_shade_os
MAX_MIN=35
SF_SPEND_CAP=3.00
CKPT_REPO=YOUR_HF_NAMESPACE/laghu-ckpt-test
EXPORT_REPO=YOUR_HF_NAMESPACE/laghu-ckpt-test
SAVE_EVERY=20
DATA_PATTERNS="shards/phaseA/shard_00000.parquet shards/phaseA/shard_00001.parquet shards/phaseA/shard_00002.parquet shards/phaseA/shard_00399.parquet shards/phaseB/shard_00323.parquet shards/phaseB/shard_00399.parquet"
CODE_REV=ef821d67177f60d64dc8d7cd85b8d7543b31d4b1
TRAIN_ARGS="$SHAPE $RECIPE --num-iterations 60 --eval-every 20 --eval-tokens 1048576 $VALS"
WANDB_RUN_ID=udgam3-sf-smoke
