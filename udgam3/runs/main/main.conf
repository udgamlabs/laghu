# Udgam-3 MAIN PRETRAINING RUN. NOT APPROVED YET: the user picks the token count and the GPU option
# (MAIN_RUN_PLAN.md §3); the numbers below are the RECOMMENDED option (40B positions on 8x H100 SXM Community).
# 150M tied Gemma-4 (d28 x 640), 2K, Muon + TST s=4 (first 25%), phase-B anneal from 80%, WSD warmdown 0.65, EMA from 90%.
# bf16 (FP8 was 0.73-0.75x slower in dry run A-fp8). Code pinned to the bundle the three dry runs used.
source "${LAGHU_REPO:-.}/udgam3/runs/main/common.sh"
RUN_NAME=udgam3-base-v1
GPU_TYPE="NVIDIA H100 80GB HBM3"   # H100 SXM, as in the dry runs
GPU_COUNT=8
CLOUD=COMMUNITY                    # other options need their own approval (see MAIN_RUN_PLAN.md §3)
NUM_ITERS=76294                    # 40.0B positions = 76,294 x 524,288 (TST reads 4 tokens/position in the first 25%)
MAX_MIN=440                        # ETA 5.40 h training x 1.25 + 35 min (start, compiles, evals, export) -> hard deadline
CKPT_REPO=YOUR_HF_NAMESPACE/laghu-base-ckpt
EXPORT_REPO=YOUR_HF_NAMESPACE/laghu-base
SAVE_EVERY=2000                    # ~8.5 min of training on 8 GPUs; newest 2 kept on HF
DISK_GB=400                        # data 81.4 GB + checkpoints + export
DATA_PATTERNS="shards/*"
CODE_REV=ef821d67177f60d64dc8d7cd85b8d7543b31d4b1   # udgam-build-code train-udgam3/ (nanochat 557c4c9, clean tree)
TRAIN_ARGS="$SHAPE $RECIPE --num-iterations $NUM_ITERS --eval-every 2000 --eval-tokens 4194304 $VALS"
WANDB_RUN_ID=udgam3-base-v1
