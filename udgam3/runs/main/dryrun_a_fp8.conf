# Udgam-3 dry run A-fp8: identical to A plus --fp8 (tensorwise). Adopt FP8 only if >= 1.2x tok/s and held-out loss within 0.3% of A at steps 100/200/300.
source "${LAGHU_REPO:-.}/udgam3/runs/main/dryrun_a.conf"
RUN_NAME=udgam3-dry-fp8
TRAIN_ARGS="$SHAPE $RECIPE --num-iterations 300 --eval-every 100 --eval-tokens 2097152 $VALS --fp8"
WANDB_RUN_ID=udgam3-dry-a-fp8
