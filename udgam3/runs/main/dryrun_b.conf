# Udgam-3 dry run B (resume test): a FRESH pod resumes dry run A's step-300 checkpoint from CKPT_REPO and continues to
# step 400. Cheaper GPU (L40S 48 GB) with device batch 16 (grad accumulation 2); the checkpoint format is GPU-independent.
source "${LAGHU_REPO:-.}/udgam3/runs/main/dryrun_a.conf"
GPU_TYPE="NVIDIA L40S"
MAX_MIN=30
TRAIN_ARGS="$(echo "$SHAPE $RECIPE" | sed 's/--device-batch-size 32/--device-batch-size 16/') --num-iterations 400 --eval-every 100 --eval-tokens 2097152 $VALS"
WANDB_RUN_ID=udgam3-dry-b
